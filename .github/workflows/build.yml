name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# only the release job writes (it publishes the release)
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: printertui-linux-x86_64, test: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: printertui-linux-aarch64, test: true }
          - { os: macos-latest, target: aarch64-apple-darwin, name: printertui-macos-aarch64, test: true }
          - { os: macos-latest, target: x86_64-apple-darwin, name: printertui-macos-x86_64, test: true }
          # the tests print for real to "Microsoft Print to PDF"
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: printertui-windows-x86_64.exe, exe: .exe, test: true }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, name: printertui-windows-aarch64.exe, exe: .exe, test: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }} && rustup component add clippy
      - run: cargo build --release --target ${{ matrix.target }}
      # the code each system builds on its own (unix.rs, win.rs, macOS parts) is linted there
      - run: cargo clippy --release --all-targets --target ${{ matrix.target }} -- -D warnings
      # the installers: syntax, and the speech bubble's text measuring with this system's awk / PowerShell
      - if: runner.os != 'Windows'
        run: |
          sh -n install.sh
          sed -n '/^wrap() {/,/^}/p' install.sh > wrap.sh
          . ./wrap.sh
          test "$(wrap '你好 ab' 20)" = "$(printf '7\t你好 ab')"
          test "$(wrap 'aaaa bbbbb' 9 | wc -l | tr -d ' ')" = 2
          test "$(wrap 'पेज स्कैन' 20 | cut -f1)" = 6
          # the installer's sounds are WAV files of the right length
          sed -n '/^synth() {/,/^}/p' install.sh > synth.sh
          . ./synth.sh
          for n in boot blip print done jam bye; do printf "$(synth $n 50)" > $n.wav; test "$(head -c 4 $n.wav)" = RIFF; test $(wc -c < $n.wav) -gt 500; done
      # the macOS install as it runs from curl | sh, without changing anything
      - if: runner.os == 'macOS'
        run: PRINTERTUI_PREVIEW=fresh sh install.sh install
      # the Linux install and uninstall as they run from curl | sh, without changing anything; a
      # download that fails (jam) or does not match its checksum (smudge) stops it with an error
      - if: runner.os == 'Linux'
        run: |
          PRINTERTUI_PREVIEW=fresh sh install.sh install
          PRINTERTUI_PREVIEW=installed sh install.sh uninstall
          for mode in jam smudge; do
            status=0
            PRINTERTUI_PREVIEW=$mode sh install.sh install || status=$?
            test $status = 1
          done
      # the Linux installer's package lists for each distribution it knows
      - if: runner.os == 'Linux'
        run: |
          sed -n '/^packages() {/,/^}/p' install.sh > packages.sh
          . ./packages.sh
          for pm in pacman apt dnf zypper; do test -n "$(packages $pm base)"; test -n "$(packages $pm extras)"; done
          packages apt base | grep -q poppler-utils
          packages dnf extras | grep -q tesseract
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          # as `irm | iex` gets it: UTF-8 (Windows PowerShell would read the file as ANSI)
          $source = [IO.File]::ReadAllText("$PWD\install.ps1", [Text.Encoding]::UTF8)
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$null, [ref]$errors)
          if ($errors) { $errors; exit 1 }
          # the whole install, without changing anything, as `irm | iex` runs it; it must leave
          # the PowerShell session as it was
          $before = $ErrorActionPreference
          foreach ($mode in 'fresh', 'installed', 'jam') {
            $env:PRINTERTUI_PREVIEW = $mode
            Invoke-Expression $source
          }
          Remove-Item Env:\PRINTERTUI_PREVIEW
          if ($ErrorActionPreference -ne $before -or (Get-Command Talk -ErrorAction SilentlyContinue) -or (Get-Variable S -ErrorAction SilentlyContinue)) { 'the installer changed the session'; exit 1 }
          $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $args[0].Name -in 'Cols', 'Wrap', 'Synth' }, $true) | ForEach-Object { Invoke-Expression $_.Extent.Text }
          foreach ($name in 'boot', 'blip', 'print', 'done', 'jam', 'bye') {
            $wav = Synth $name 50
            if ([Text.Encoding]::ASCII.GetString($wav, 0, 4) -ne 'RIFF' -or $wav.Length -lt 500 -or [BitConverter]::ToInt32($wav, 40) -ne $wav.Length - 44) { "bad $name"; exit 1 }
          }
          if ((Cols ([string]::new([char[]](0x4F60, 0x597D)) + 'ab')) -ne 6) { exit 1 }
          if ((Wrap 'aaaa bbbbb' 9).Count -ne 2) { exit 1 }
      - if: matrix.test
        run: cargo test --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/printertui${{ matrix.exe }} ${{ matrix.name }}
      # install.sh and install.ps1 refuse a binary that does not match this
      - run: (sha256sum ${{ matrix.name }} || shasum -a 256 ${{ matrix.name }}) > ${{ matrix.name }}.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # a Scoop manifest for this release: scoop install https://github.com/<repo>/releases/latest/download/printertui.json
      - run: sh packaging/scoop.sh "${GITHUB_REF_NAME#v}" "${{ github.repository }}" dist > dist/printertui.json
      - run: gh release create ${{ github.ref_name }} dist/printertui-* dist/printertui.json --repo ${{ github.repository }} --title ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
