name: build

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: printertui-${{ runner.os }}-${{ runner.arch }}
          path: target/release/printertui
