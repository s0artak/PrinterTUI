name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: printertui-linux-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: printertui-macos-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: printertui-macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/printertui ${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: gh release create ${{ github.ref_name }} printertui-* --repo ${{ github.repository }} --title ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
